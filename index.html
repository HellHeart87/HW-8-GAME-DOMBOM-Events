<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pixel Invaders — Neon Defense</title><link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body><main class="layout"><section class="stage-wrap"><div class="stage"><canvas id="field" aria-label="Ігрове поле"></canvas><div class="overlay" id="overlay"><h2 id="overlayTitle">Pixel Invaders</h2><p id="overlayText">Знищуй кораблі. Не дай їм дістатися нижньої межі.</p></div></div></section>
<aside class="panel"><header><p class="tagline">SYSTEM ONLINE // NEON DEFENSE</p><h1>PIXEL<span>INVADERS</span></h1></header><dl class="stats"><div><dt>Очки</dt><dd id="score">0</dd></div><div><dt>Збито</dt><dd id="kills">0</dd></div><div><dt>Швидкість</dt><dd id="speedNow">1</dd></div><div><dt>Рекорд</dt><dd id="best">0</dd></div></dl><form id="startForm"><fieldset><legend>Базова швидкість</legend><div class="speeds" id="speeds"></div></fieldset><p id="error" class="error" role="alert" hidden></p><button class="primary" id="startBtn">Почати гру</button></form><button class="ghost" id="pauseBtn" type="button">Пауза / Продовжити</button><button class="ghost" id="soundBtn" type="button" aria-pressed="true">Звук: увімкнено</button><ul class="keys"><li><kbd>← →</kbd> / <kbd>A D</kbd> рух</li><li><kbd>Space</kbd> вогонь</li><li><kbd>P</kbd> пауза</li></ul></aside></main>
<div class="touch" aria-label="Мобільне керування"><button data-act="left" aria-label="Вліво">◀</button><button data-act="fire">FIRE</button><button data-act="right" aria-label="Вправо">▶</button></div>
<script src="config.js"></script><script src="errors.js"></script><script src="sound.js"></script><script src="ship.js"></script><script src="game.js"></script><script src="main.js"></script></body></html>
